plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eatstevan.emealio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.eatstevan.emealio'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    // One fixed key for every build, so updates install over the previous version and the
    // SHA-1 registered for Google sign-in stays valid. The keystore is kept out of git.
    def keystore = rootProject.file('signing/glonky.keystore')
    signingConfigs {
        if (keystore.exists()) {
            family {
                storeFile keystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            if (keystore.exists()) signingConfig signingConfigs.family
        }
        release {
            minifyEnabled false
            if (keystore.exists()) signingConfig signingConfigs.family
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}

// Family sharing needs app/google-services.json from your own Firebase project (see SHARING-SETUP.md).
// Without it the app still builds and works, with sharing switched off.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
